# モデルのハイパーパラメータ定義
# train.py から src.utils.config.load_model_params() 経由で読み込む。
# セクション名（例: lgbm）= モデル種別。新しいモデルを追加する場合はセクションを増やす。

# LightGBM 回帰モデル（取引価格の対数を予測）の固定パラメータ
# Optunaで探索しない、全試行で共通のパラメータ
lgbm:
  objective: huber       # 損失関数（L2 = MSE 最小化）
  metric: rmse                # 検証指標
  boosting_type: gbdt         # ブースティング種別
  subsample_freq: 1           # サブサンプリングを行う頻度（反復ごと）
  random_state: 42            # 再現性のための乱数シード
  n_jobs: -1                  # 並列スレッド数（-1 = 全コア）
  verbose: -1                 # ログ出力レベル（-1 = 抑制）

# Optuna が探索するハイパーパラメータの範囲
# type: int / float、log: true で対数スケール探索
lgbm_search_space:
  n_estimators:
    type: int
    low: 100
    high: 2000
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  num_leaves:
    type: int
    low: 15
    high: 255
  max_depth:
    type: int
    low: 3
    high: 12
  min_child_samples:
    type: int
    low: 5
    high: 100
  subsample:
    type: float
    low: 0.6
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.6
    high: 1.0
  reg_alpha:
    type: float
    low: 0.001
    high: 10.0
    log: true
  reg_lambda:
    type: float
    low: 0.001
    high: 10.0
    log: true

# Optuna・データ分割の設定
optuna:
  n_trials: 50      # Optuna の試行回数
  test_size: 0.2    # テストデータの割合
  val_size: 0.2     # 検証データの割合（全体に対する割合）

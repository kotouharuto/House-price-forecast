[project]
name = "tokyo-rent-predictor"
version = "0.1.0"
description = "東京都賃貸物件の賃料予測モデル + Streamlitアプリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "shap",
    "matplotlib",
    "seaborn",
    "plotly",
    "streamlit",
    "jupyter",
    "ipykernel",
    "matplotlib-fontja",
    "optuna>=4.8.0",
    "pyyaml>=6.0.3",
    "huggingface-hub>=1.18.0",
    "branca>=0.8.2",
    "folium>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ ディレクトリ自体をパッケージとして配布する（src layoutではなくフラット同梱）
[tool.hatch.build.targets.wheel]
packages = ["src"]

# 開発用依存（PEP 735準拠の dependency-groups に一本化）
[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.0",
    "mypy>=1.10",
    "types-pyyaml",
]

# =============================================================================
# Ruff 設定
# =============================================================================
[tool.ruff]
# 行長の上限。データ分析プロジェクトでは長い列名・SQL等が多いため100を採用
line-length = 100
target-version = "py312"
# notebooks は探索用なのでLint対象外、data/models/.venv は生成物
exclude = ["notebooks", ".venv", "data", "models", "outputs"]

[tool.ruff.lint]
# 採用ルール
select = [
    "E",   # pycodestyle (PEP8 準拠)
    "W",   # pycodestyle warnings
    "F",   # pyflakes (未使用import・未定義変数など)
    "I",   # isort (import順序の自動整列)
    "B",   # flake8-bugbear (バグになりやすいパターン)
    "UP",  # pyupgrade (古い構文を新しい構文へ)
    "N",   # pep8-naming (命名規則)
    "SIM", # flake8-simplify (冗長な書き方を簡潔に)
]
ignore = [
    "E501", # 行長は line-length で制御するため重複ルール無効化
]

[tool.ruff.lint.per-file-ignores]
# テストは関数名規則(N802)を緩めにしてケース名を表現的に書けるようにする
"tests/**/*.py" = ["N802"]
# __init__.py は再エクスポート目的でのF401(未使用import)を許容
"**/__init__.py" = ["F401"]
# 機械学習コードは X, y, X_train 等の大文字命名が標準のため N803/N806 を許容
"src/modeling/*.py" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# pytest 設定
# =============================================================================
[tool.pytest.ini_options]
# プロジェクトルートを sys.path に追加し、テストから `src.xxx` を import 可能にする
pythonpath = ["."]
testpaths = ["tests"]
